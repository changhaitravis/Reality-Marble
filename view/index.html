<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reality Marble</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <style>
        /* Preview gallery: flex grid replacing the old floated thumbnails */
        #gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        #gallery .thumbnail {
            width: 150px;
            height: 150px;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 0.125em 0.25em rgba(10, 10, 10, 0.1);
        }
        #gallery .thumbnail img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <section class="hero is-primary">
        <div class="hero-body">
            <p class="title">Reality Marble</p>
            <p class="subtitle">Turn any photo into a Soratama (glass marble) shot. Upload an image and let the sphere do the rest.</p>
            <a class="button is-dark" href="https://github.com/changhaitravis/Reality-Marble">View on GitHub</a>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="box">
                <form action="https://us-central1-dizzy-165804.cloudfunctions.net/soratamafy" enctype="multipart/form-data" method="post" id="soratama">
                    <div class="field">
                        <div class="file has-name is-boxed is-primary">
                            <label class="file-label">
                                <input class="file-input" type="file" name="upload" accept="image/*">
                                <span class="file-cta">
                                    <span class="file-label">Choose an image…</span>
                                </span>
                                <span class="file-name">No file chosen</span>
                            </label>
                        </div>
                    </div>
                    <div class="field">
                        <button class="button is-primary" type="submit" form="soratama">Upload</button>
                    </div>
                </form>
            </div>

            <h2 class="title is-4 mt-5">Preview</h2>
            <div id="gallery"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="content has-text-centered">
            <p>Reality Marble transforms photos with ImageMagick on Google Cloud Run. Apache-2.0.</p>
        </div>
    </footer>

    <script src="gallery.js"></script>
</body>
</html>
